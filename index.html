<a href="#main" class="skip-link">Skip to content</a>

<!-- Directional blur filters used for motion simulation -->
<svg class="svg-defs" aria-hidden="true" focusable="false">
  <defs>
    <filter id="motion-x" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur id="motion-x-blur" stdDeviation="0 0" edgeMode="duplicate"/>
    </filter>
    <filter id="motion-y" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur id="motion-y-blur" stdDeviation="0 0" edgeMode="duplicate"/>
    </filter>
  </defs>
</svg>

<header class="sticky top-0 z-40 border-b border-line/80 bg-ink/85 backdrop-blur-xl">
  <div class="mx-auto flex max-w-7xl items-center gap-4 px-4 py-3 sm:px-6">
    <a href="#/" class="brand shrink-0" data-route-link>
      <svg class="brand-camera" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 7.5h3.2l1.4-2h6.8l1.4 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2Z"/>
        <circle cx="12" cy="13.5" r="4"/>
        <circle cx="18.5" cy="10" r=".8" class="brand-camera-light"/>
      </svg>
      <span class="text-[13px] font-semibold tracking-[0.22em] uppercase">Photography&nbsp;Lab</span>
    </a>
    <nav id="nav" aria-label="Labs" class="nav-scroll ml-auto flex items-center gap-1 overflow-x-auto"></nav>
  </div>
</header>

<main id="main" class="mx-auto w-full max-w-7xl px-4 pb-24 sm:px-6"></main>
